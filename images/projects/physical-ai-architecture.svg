<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Physical AI data pipeline architecture</title>
  <desc id="description">A lifecycle from source assets through portable contracts, OpenUSD composition, deterministic planning and validation, a verified headless Isaac Lab and PhysX proxy, then future rendering, training, SIL, HIL, robot deployment, and monitoring.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowLocal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTarget" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowFeedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .zone-label { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .5px; }
      .box-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box-copy { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .gate { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .badge { font: 700 10px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .7px; }
      .legend { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .local-box { fill: #e8f2ff; stroke: #2563eb; stroke-width: 2; }
      .target-box { fill: #19375f; stroke: #60a5fa; stroke-width: 2; }
      .local-title { fill: #172554; }
      .local-copy { fill: #334155; }
      .target-title, .target-copy { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>

  <text x="64" y="56" class="title">Physical AI data pipeline: evidence to deployment and back</text>
  <text x="64" y="84" class="subtitle">Portable metadata pipeline + verified headless Isaac Lab/PhysX proxy · rendering, training, and robot execution remain gated</text>

  <!-- Local zone -->
  <rect x="48" y="112" width="1344" height="264" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="72" y="143" class="zone-label" fill="#1d4ed8">IMPLEMENTED LOCALLY · PYTHON STANDARD LIBRARY</text>

  <g filter="url(#shadow)">
    <rect x="76" y="178" width="260" height="148" rx="14" class="local-box"/>
    <rect x="410" y="178" width="260" height="148" rx="14" class="local-box"/>
    <rect x="744" y="178" width="260" height="148" rx="14" class="local-box"/>
    <rect x="1078" y="178" width="260" height="148" rx="14" class="local-box"/>
  </g>

  <rect x="92" y="194" width="78" height="20" rx="10" fill="#dbeafe"/>
  <text x="105" y="208" class="badge" fill="#1d4ed8">SOURCE</text>
  <text x="98" y="242" class="box-title local-title">Engineering inputs</text>
  <text x="98" y="267" class="box-copy local-copy">
    <tspan x="98" dy="0">URDF · calibration · telemetry</tspan>
    <tspan x="98" dy="20">IDs · versions · source paths</tspan>
    <tspan x="98" dy="20">Explicitly labeled example data</tspan>
  </text>

  <rect x="426" y="194" width="116" height="20" rx="10" fill="#dbeafe"/>
  <text x="438" y="208" class="badge" fill="#1d4ed8">CONTRACT</text>
  <text x="432" y="242" class="box-title local-title">Ingest &amp; normalize</text>
  <text x="432" y="267" class="box-copy local-copy">
    <tspan x="432" dy="0">Paths · scale · frames · schema</tspan>
    <tspan x="432" dy="20">Sensor intrinsics &amp; extrinsics</tspan>
    <tspan x="432" dy="20">Containment and value checks</tspan>
  </text>

  <rect x="760" y="194" width="88" height="20" rx="10" fill="#dbeafe"/>
  <text x="772" y="208" class="badge" fill="#1d4ed8">OPENUSD</text>
  <text x="766" y="242" class="box-title local-title">Composed digital twin</text>
  <text x="766" y="267" class="box-copy local-copy">
    <tspan x="766" dy="0">Robot asset + workcell reference</tspan>
    <tspan x="766" dy="20">Hierarchy · metadata · units</tspan>
    <tspan x="766" dy="20">Conservative text USDA</tspan>
  </text>

  <rect x="1094" y="194" width="122" height="20" rx="10" fill="#dbeafe"/>
  <text x="1106" y="208" class="badge" fill="#1d4ed8">DRY RUN</text>
  <text x="1100" y="242" class="box-title local-title">Plan, lineage &amp; gates</text>
  <text x="1100" y="267" class="box-copy local-copy">
    <tspan x="1100" dy="0">Seeded scenario metadata</tspan>
    <tspan x="1100" dy="20">Manifest · SHA-256 · provenance</tspan>
    <tspan x="1100" dy="20">Zero rendered frames</tspan>
  </text>

  <line x1="336" y1="252" x2="399" y2="252" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowLocal)"/>
  <line x1="670" y1="252" x2="733" y2="252" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowLocal)"/>
  <line x1="1004" y1="252" x2="1067" y2="252" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowLocal)"/>
  <text x="351" y="237" class="gate">source gate</text>
  <text x="687" y="237" class="gate">twin gate</text>
  <text x="1018" y="237" class="gate">plan gate</text>

  <!-- Target zone -->
  <rect x="48" y="420" width="1344" height="302" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="9 7"/>
  <g filter="url(#shadow)">
    <rect x="72" y="496" width="168" height="150" rx="14" class="target-box"/>
    <rect x="260" y="496" width="168" height="150" rx="14" class="target-box"/>
    <rect x="448" y="496" width="168" height="150" rx="14" class="target-box"/>
    <rect x="636" y="496" width="168" height="150" rx="14" class="target-box"/>
    <rect x="824" y="496" width="168" height="150" rx="14" class="target-box"/>
    <rect x="1012" y="496" width="168" height="150" rx="14" class="target-box"/>
    <rect x="1200" y="496" width="168" height="150" rx="14" class="target-box"/>
  </g>

  <text x="92" y="532" class="box-title target-title">Isaac Sim</text>
  <text x="92" y="558" class="box-copy target-copy">
    <tspan x="92" dy="0">Proxy physics verified</tspan>
    <tspan x="92" dy="20">Sensors &amp; articulation future</tspan>
    <tspan x="92" dy="20">Pinned runtime versions</tspan>
  </text>

  <text x="280" y="532" class="box-title target-title">Replicator</text>
  <text x="280" y="558" class="box-copy target-copy">
    <tspan x="280" dy="0">Apply randomizers</tspan>
    <tspan x="280" dy="20">Render RGB / depth</tspan>
    <tspan x="280" dy="20">Segmentation / pose</tspan>
  </text>

  <text x="468" y="532" class="box-title target-title">Dataset &amp; manifest</text>
  <text x="468" y="558" class="box-copy target-copy">
    <tspan x="468" dy="0">Immutable shards</tspan>
    <tspan x="468" dy="20">Annotation QA</tspan>
    <tspan x="468" dy="20">Splits &amp; lineage</tspan>
  </text>

  <text x="656" y="532" class="box-title target-title">Isaac Lab</text>
  <text x="656" y="558" class="box-copy target-copy">
    <tspan x="656" dy="0">Proxy stepping verified</tspan>
    <tspan x="656" dy="20">Training future</tspan>
    <tspan x="656" dy="20">Held-out evaluation future</tspan>
  </text>

  <text x="844" y="532" class="box-title target-title">SIL → HIL</text>
  <text x="844" y="558" class="box-copy target-copy">
    <tspan x="844" dy="0">Interfaces &amp; timing</tspan>
    <tspan x="844" dy="20">Target compute &amp; I/O</tspan>
    <tspan x="844" dy="20">Safety release gates</tspan>
  </text>

  <text x="1032" y="532" class="box-title target-title">Robot deployment</text>
  <text x="1032" y="558" class="box-copy target-copy">
    <tspan x="1032" dy="0">Bounded policy output</tspan>
    <tspan x="1032" dy="20">Watchdog &amp; fallback</tspan>
    <tspan x="1032" dy="20">Versioned rollback</tspan>
  </text>

  <text x="1220" y="532" class="box-title target-title">Monitor &amp; learn</text>
  <text x="1220" y="558" class="box-copy target-copy">
    <tspan x="1220" dy="0">Telemetry &amp; failures</tspan>
    <tspan x="1220" dy="20">Triage &amp; replay</tspan>
    <tspan x="1220" dy="20">Targeted twin updates</tspan>
  </text>

  <line x1="240" y1="571" x2="249" y2="571" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowTarget)"/>
  <line x1="428" y1="571" x2="437" y2="571" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowTarget)"/>
  <line x1="616" y1="571" x2="625" y2="571" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowTarget)"/>
  <line x1="804" y1="571" x2="813" y2="571" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowTarget)"/>
  <line x1="992" y1="571" x2="1001" y2="571" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowTarget)"/>
  <line x1="1180" y1="571" x2="1189" y2="571" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrowTarget)"/>

  <!-- Contract handoffs -->
  <path d="M 874 326 C 840 386, 210 390, 156 486" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowLocal)"/>
  <path d="M 1208 326 C 1160 394, 394 382, 344 486" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowLocal)"/>
  <rect x="490" y="386" width="460" height="28" rx="14" fill="#eef4fb" fill-opacity="0.96"/>
  <text x="508" y="404" class="gate">validated stage + deterministic scenario contract</text>
  <rect x="62" y="429" width="670" height="36" rx="10" fill="#f8fafc" fill-opacity="0.98"/>
  <text x="72" y="452" class="zone-label" fill="#475569">GPU / ROBOT PATH · PROXY SMOKE VERIFIED · FULL WORKFLOW FUTURE</text>

  <!-- Monitoring feedback -->
  <path d="M 1284 646 C 1284 770, 1270 786, 1110 786 L 182 786 C 90 786, 58 730, 58 660 L 58 410 C 58 372, 67 350, 78 336" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowFeedback)"/>
  <rect x="480" y="766" width="480" height="38" rx="19" fill="#ccfbf1" stroke="#0f766e"/>
  <text x="512" y="790" class="box-copy" fill="#115e59">Failure cases → replay → system identification → revised scenes and randomization</text>

  <!-- Legend -->
  <g transform="translate(72 838)">
    <rect x="0" y="-14" width="26" height="18" rx="4" class="local-box"/>
    <text x="38" y="0" class="legend">Implemented and tested locally</text>
    <rect x="252" y="-14" width="26" height="18" rx="4" class="target-box"/>
    <text x="290" y="0" class="legend">GPU / hardware path (proxy smoke only)</text>
    <line x1="652" y1="-5" x2="692" y2="-5" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowLocal)"/>
    <text x="708" y="0" class="legend">Contract handoff</text>
    <line x1="874" y1="-5" x2="914" y2="-5" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowFeedback)"/>
    <text x="930" y="0" class="legend">Operational feedback loop</text>
  </g>
  <text x="1368" y="872" text-anchor="end" class="subtitle">Metadata + headless proxy validated · no rendered dataset, trained policy, or robot results</text>
</svg>
